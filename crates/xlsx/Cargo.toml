[package]
name = "gridcraft-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints]
workspace = true

[features]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-model = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
memchr = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
crc32fast = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# Encryption keys and salts need the OS CSPRNG. The web build has no secure random source we can
# reach (getrandom's `wasm_js` backend would add a JavaScript dependency this repo doesn't take),
# so a password-protected save is refused there instead of made with weak entropy.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
