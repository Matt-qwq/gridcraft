[package]
name = "gridcraft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft core types: cell addresses, values, errors, date serials, fonts and the text engine"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# Text: the Unicode bidi algorithm and OpenType shaping (see `src/text.rs`).
rustybuzz = { workspace = true }
unicode-bidi = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde_json = { workspace = true }
# Real font bytes for the text tests (Ubuntu Light, compiled into epaint). No font binary is
# committed to this repository, so the shaping tests take a face that ships with a crate.
epaint_default_fonts = { workspace = true }
